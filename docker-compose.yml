version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=file:/data/dev.db
    volumes:
      - sqlite_data:/data
    command: sh -c "mkdir -p /data && npx prisma migrate deploy && npm run start:prod"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://backend:4000/api
      - NEXT_PUBLIC_API_BASE=http://localhost:4000/api
    depends_on:
      - backend

volumes:
  sqlite_data:
